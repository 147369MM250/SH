<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual"/>
<title>石昊电竞</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto}
:root{
  --primary:#007AFF;
  --bg:#F5F5F7;
  --card:#FFFFFF;
  --text:#1D1D1F;
  --text-gray:#86868B;
  --bubble-service:#007AFF;
  --bubble-user:#E9E9EB;
  --radius:20px;
  --shadow:0 2px 12px rgba(0,0,0,0.08);
  --sidebar-width:280px;
  --keyboard-offset:0px;
}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
.home-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px}
.home-card{background:var(--card);width:min(90%,360px);padding:50px 28px;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.home-card h1{font-size:22px;margin-bottom:10px}
.home-card .desc{color:var(--text-gray);font-size:14px;margin-bottom:40px}
.button-group{display:flex;flex-direction:column;gap:20px}
.btn{border:none;background:var(--primary);color:white;padding:16px 24px;border-radius:999px;font-size:16px;cursor:pointer;transition:0.2s;width:100%}
.btn:active{opacity:0.8}
.btn-admin{background:#e8e8ed;color:#1d1d1f}
.btn-small{padding:8px 14px;font-size:13px;width:auto;border-radius:12px}
.btn-gray{background:#e8e8ed;color:#333}
.mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:9999;}
.pop-box{width:285px;background:#ffffff;border-radius:14px;overflow:hidden;text-align:center;}
.pop-title{padding:18px 16px 8px;font-weight:600;font-size:17px;}
.pop-desc{font-size:13px;color:#86868b;padding:0 16px 16px;}
#adminPwd{width:calc(100% - 32px);margin:0 16px 16px;padding:11px;border:1px solid #d2d2d7;border-radius:8px;font-size:16px;outline:none;}
.pop-btn-group{display:flex;border-top:1px solid #d2d2d7;}
.pop-btn-group button{flex:1;padding:13px 0;border:none;background:none;font-size:16px;cursor:pointer;}
.btn-cancel{color:#007aff;border-right:1px solid #d2d2d7;}
.btn-confirm{color:#007aff;font-weight:500;}
.page{
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
#homePage{display:flex;}
.app-wrap{display:flex;height:100%;width:100%}
.sidebar{width:var(--sidebar-width);background:#fff;border-right:1px solid #e8e8ed;display:flex;flex-direction:column;transition:0.3s ease;}
.sidebar.hidden{width:0;overflow:hidden;border:none}
.sidebar-header{padding:12px;border-bottom:1px solid #eee}
.auto-reply-box{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.auto-reply-box textarea{border:1px solid #ddd;border-radius:10px;padding:8px;resize:none;height:60px;font-size:13px;}
.save-auto{border:none;background:var(--primary);color:#fff;padding:6px;border-radius:8px;cursor:pointer;font-size:13px;}
.user-list{flex:1;overflow-y:auto}
.user-item{padding:12px 14px;border-bottom:1px solid #f3f3f3;cursor:pointer;display:flex;align-items:center;gap:10px;position:relative;}
.user-item.active{background:#f0f7ff}
.user-item:hover{background:#f7f7f9}
.red-dot{width:9px;height:9px;background:#ff3b30;border-radius:50%;position:absolute;right:12px;top:14px;}
.avatar-sm{width:36px;height:36px;border-radius:50%;background:#ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.user-info{flex:1;overflow:hidden}
.uname{font-size:14px}
.last-msg{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.chat-main{flex:1;display:flex;flex-direction:column;height:100%;}
.chat-header{background:var(--card);display:flex;align-items:center;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.05);gap:12px;flex-shrink:0;}
.toggle-bar{width:34px;height:34px;border-radius:8px;border:none;background:#eee;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.header-info{flex:1}
.header-info .name{font-weight:500;font-size:16px}
.chat-body{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.date-divider{text-align:center;font-size:12px;color:var(--text-gray);margin:8px 0}
.msg-row{display:flex;width:100%}
.msg-row.user-left{justify-content:flex-start}
.msg-row.service-right{justify-content:flex-end}
.msg-wrap{max-width:70%;display:flex;flex-direction:column}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:15px;word-break:break-all}
.msg-row.user-left .msg-bubble{background:var(--bubble-user);color:#111;border-bottom-left-radius:4px}
.msg-row.service-right .msg-bubble{background:var(--bubble-service);color:white;border-bottom-right-radius:4px}
.msg-media{border-radius:18px;overflow:hidden;max-width:240px;background:#111;cursor:pointer}
.msg-media img,.msg-media video{width:100%;display:block;min-height:130px;object-fit:cover}
.msg-meta{font-size:11px;margin-top:4px;padding:0 6px;color:var(--text-gray);display:flex;justify-content:space-between;align-items:center}
.msg-row.service-right .msg-meta{color:rgba(255,255,255,0.75)}
.read-tag{font-size:10px;color:#34C759}
.unread-tag{font-size:10px;color:#FF9500}
.chat-footer{
  background:var(--card);
  padding:10px 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom) + var(--keyboard-offset));
  display:flex;
  gap:8px;
  align-items:center;
  border-top:1px solid #e8e8ed;
  flex-shrink:0;
}
.action-btn{width:38px;height:38px;border-radius:50%;border:none;background:#eee;cursor:pointer;font-size:18px;flex-shrink:0}
.input-box{flex:1;border-radius:18px;background:#eee;padding:10px 14px;border:none;outline:none;font-size:16px;min-width:0;-webkit-appearance:none}
.btn-send{border:none;background:var(--primary);color:white;padding:10px 16px;border-radius:18px;cursor:pointer;flex-shrink:0}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:15px}
.preview-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
.preview-modal.show{display:flex}
.preview-content{max-width:90%;max-height:80vh;border-radius:12px}
.file-input{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-animate{animation:fadeIn 0.25s ease}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(30,30,32,0.85);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:9999;opacity:0;transition:0.25s ease;pointer-events:none}
.toast.show{opacity:1}
.client-home-page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.client-home-card{background:var(--card);width:min(90%,360px);padding:50px 28px;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.client-home-card h1{font-size:22px;margin-bottom:10px}
.client-home-card .desc{color:var(--text-gray);font-size:14px;margin-bottom:30px}
.name-input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:20px;text-align:center;outline:none;-webkit-appearance:none}
.client-chat-page{display:none;height:100%;flex-direction:column}
.client-chat-header{background:var(--card);display:flex;align-items:center;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.05);gap:12px;padding-top:env(safe-area-inset-top);flex-shrink:0;}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#ddd}
.client-header-info{flex:1}
.client-header-info .name{font-weight:500;font-size:16px}
.client-header-info .status{font-size:12px;color:#34c759}
.client-chat-body{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.client-msg-row{display:flex;width:100%}
.client-msg-row.user-right{justify-content:flex-end}
.client-msg-row.service-left{justify-content:flex-start}
.client-msg-wrap{max-width:70%;display:flex;flex-direction:column}
.client-msg-bubble{padding:10px 14px;border-radius:18px;font-size:15px;word-break:break-all}
.client-msg-row.user-right .client-msg-bubble{background:var(--bubble-admin,#007AFF);color:white;border-bottom-right-radius:4px}
.client-msg-row.service-left .client-msg-bubble{background:var(--bubble-user);color:#111;border-bottom-left-radius:4px}
.client-msg-media{border-radius:18px;overflow:hidden;max-width:240px;background:#111;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;cursor:pointer}
.client-msg-media video, .client-msg-media img{width:100%;display:block;min-height:130px;object-fit:cover}
.client-msg-meta{font-size:11px;margin-top:4px;padding:0 6px;color:var(--text-gray);display:flex;justify-content:space-between}
.client-msg-row.user-right .client-msg-meta{color:rgba(255,255,255,0.75)}
.new-tip{text-align:center;padding:8px;color:var(--primary);font-size:13px;cursor:pointer}
.client-chat-footer{
  background:var(--card);
  padding:10px 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom) + var(--keyboard-offset));
  display:flex;
  gap:8px;
  align-items:center;
  border-top:1px solid #e8e8ed;
  flex-shrink:0;
}
#userInput{
  flex: 1 1 auto;
  border-radius:20px;
  background:#eee;
  padding:12px 16px;
  border:none;
  outline:none;
  font-size:16px;
  min-width:0;
  -webkit-appearance:none;
}
.client-chat-footer .btn{
  width:auto !important;
  padding:10px 14px !important;
  border-radius:20px;
  font-size:14px;
  flex-shrink:0;
  min-width:54px;
}
.header-actions{display:flex;gap:8px;align-items:center}
.client-avatar-block{display:flex;flex-direction:column;align-items:center;gap:3px}
.client-avatar-block .avatar{width:38px;height:38px;cursor:pointer;border:1px solid #eee}
.music-btn{width:24px;height:16px;border:none;background:none;font-size:13px;line-height:1;cursor:pointer;padding:0;opacity:0.5;color:var(--text-gray);-webkit-tap-highlight-color:transparent}
.music-btn:active{opacity:1}
.music-btn.on{opacity:0.9}
.avatar-spin{animation:spin 2s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="previewModal" class="preview-modal" onclick="closePreview()">
  <div><img id="previewImg" class="preview-content" style="display:none"/><video id="previewVid" class="preview-content" controls style="display:none"></video></div>
</div>
<div id="homePage" class="page home-wrap">
  <div class="home-card">
    <h1>石昊电竞</h1>
    <p class="desc">在线客服 · 全天在线</p>
    <div class="button-group">
      <button class="btn" onclick="openUserClient()">联系客服</button>
      <button class="btn btn-admin" onclick="showPasswordPopup()">切换身份（客服后台）</button>
    </div>
  </div>
</div>
<div id="pwdMask" class="mask">
  <div class="pop-box">
    <div class="pop-title">验证身份</div>
    <div class="pop-desc">请输入管理员访问密码</div>
    <input id="adminPwd" type="password" placeholder="请输入密码" autocomplete="off">

      <button class="btn-cancel" onclick="closePopup()">取消</button>
      <button class="btn-confirm" onclick="verifyPassword()">确定</button>

</div>
<div id="userClientPage" class="page">
  <div id="toast" class="toast"></div>
  <div class="client-home-page" id="clientHomeWrap">
    <div class="client-home-card">
      <h1>石昊电竞</h1>
      <p class="desc">在线客服 · 全天在线</p>
      <input id="visitorNameInput" class="name-input" type="text" placeholder="输入你的昵称（可选）" maxlength="12"/>
      <div class="button-group">
        <button class="btn" onclick="enterChat()">联系客服</button>

    </div>

  <div id="clientChatWrap" class="client-chat-page">
    <div class="client-chat-header">
      <img id="serviceAvatarTop" class="avatar" src="https://cccimg.com/view.php/94a6891ae4c817663f2c90c8b1b032b2.png" alt=""/>
      <div class="client-header-info">
        <div class="name" id="serviceNameTop">在线客服</div>
        <div class="status">在线</div>
      </div>
      <div class="header-actions">
        <div class="client-avatar-block">
          <img id="clientTopAvatar" class="avatar" src="https://cccimg.com/view.php/94a6891ae4c817663f2c90c8b1b032b2.png" alt="头像" title="点击播放音乐 · 长按清空聊天记录" onpointerdown="avatarPointerDown(event)" onpointerup="avatarPointerUp(event)" onpointerleave="avatarPointerLeave()" ondragstart="return false"/>
          <button class="music-btn" id="musicBtn" onclick="toggleMusic()">♫</button>

    <div id="newMsgTip" class="new-tip" style="display:none" onclick="scrollBottom()">有新消息</div>

      <input type="file" id="userImgUpload" class="file-input" accept="image/*"/>
      <input type="file" id="userVidUpload" class="file-input" accept="video/*"/>
      <button class="action-btn" onclick="document.getElementById('userImgUpload').click()">🖼</button>
      <button class="action-btn" onclick="document.getElementById('userVidUpload').click()">🎬</button>

<div id="adminPage" class="page">
<div class="app-wrap">
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="auto-reply-box">
        <textarea id="autoReplyInput" placeholder="设置自动回复话术（访客发消息自动回复）"></textarea>
        <button class="save-auto" onclick="saveAutoReply()">保存自动回复</button>

    <div id="userListWrap" class="user-list"></div>
  </div>
  <div class="chat-main">
    <div class="chat-header">
      <button class="toggle-bar" onclick="toggleSidebar()">☰</button>
      <div class="header-info">
        <div class="name" id="currentChatName">选择一个用户会话</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-small btn-gray" onclick="clearCurrentChat()">清空对话</button>
      </div>
    </div>
    <div id="chatBodyAdmin" class="chat-body">
      <div class="empty-chat">左侧点击用户开始对话</div>
    </div>
    <div class="chat-footer">
      <input type="file" id="adminImgUpload" class="file-input" accept="image/*"/>
      <input type="file" id="adminVidUpload" class="file-input" accept="video/*"/>
      <button class="action-btn" onclick="document.getElementById('adminImgUpload').click()">🖼</button>
      <button class="action-btn" onclick="document.getElementById('adminVidUpload').click()">🎬</button>
      <input id="serviceInput" class="input-box" placeholder="输入回复消息..." onkeydown="if(event.key==='Enter')sendServiceMsg()"/>
      <button class="btn-send" onclick="sendServiceMsg()">发送</button>
    </div>
  </div>
</div>
</div>
<script>
const EMAILJS_PUBLIC_KEY = "cb7md1uaMtFlhjRA3";
const EMAILJS_SERVICE_ID = "service_6f076jk";
const EMAILJS_TEMPLATE_ID = "template_qu8fj6n";
const ADMIN_RECEIVE_EMAIL = "3906751671@qq.com";
try{emailjs.init({publicKey:EMAILJS_PUBLIC_KEY})}catch(e){console.log("emailjs init",e)}
let db = null;
let bc = null;
try{bc = new BroadcastChannel('5h_service_channel_v6')}catch(e){console.log("bc not supported")}
let currentSelectUserId = null;
let myUserId = null;
const ADMIN_PASSWORD = "18131138682";
const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect fill='%23007AFF' width='40' height='40' rx='20'/%3E%3Ctext x='20' y='26' font-size='18' fill='white' text-anchor='middle' font-family='sans-serif'%3E客%3C/text%3E%3C/svg%3E";
const CLIENT_AVATAR = "https://cccimg.com/view.php/94a6891ae4c817663f2c90c8b1b032b2.png";
const WELCOME_TEXT = "您好，欢迎来到石昊电竞！请问有什么可以帮您？";
const MUSIC_URL = "https://music.163.com/song/media/outer/url?id=1394167216.mp3";
let musicPlaying = false;
const musicAudio = new Audio(MUSIC_URL);
musicAudio.loop = true;
let initVisualHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
function updateKeyboardOffset(){
  if(!window.visualViewport) return;
  const diff = initVisualHeight - window.visualViewport.height;
  if(diff > 120){
    document.documentElement.style.setProperty('--keyboard-offset', diff + 'px');
  }else{
    document.documentElement.style.setProperty('--keyboard-offset','0px');
  }
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',updateKeyboardOffset);
}
document.addEventListener('focusin',function(e){
  if(e.target.tagName === "INPUT"){
    setTimeout(()=>{
      e.target.scrollIntoView({block:'center',behavior:'smooth'});
      scrollBottom();
    },150)
  }
})
function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open("5hServiceDBV7",1);
    req.onupgradeneeded = e=>{
      db = e.target.result;
      if(!db.objectStoreNames.contains("users")) db.createObjectStore("users",{keyPath:"id"});
      if(!db.objectStoreNames.contains("messages")){
        const msgStore = db.createObjectStore("messages",{keyPath:"id"});
        msgStore.createIndex("userId","userId");
      }
      if(!db.objectStoreNames.contains("settings")) db.createObjectStore("settings",{keyPath:"key"});
    };
    req.onsuccess = e=>{db=e.target.result;res(db)};
    req.onerror = e=>rej(e);
  })
}
async function dbGet(store,id){return new Promise(res=>{const tx=db.transaction(store,"readonly");const s=tx.objectStore(store);const r=s.get(id);r.onsuccess=()=>res(r.result)})}
async function dbPut(store,data){return new Promise(res=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(data);tx.oncomplete=()=>res()})}
async function dbGetAll(store){return new Promise(res=>{const tx=db.transaction(store,"readonly");const s=tx.objectStore(store);const r=s.getAll();r.onsuccess=()=>res(r.result)})}
async function dbDelete(store,id){return new Promise(res=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(id);tx.oncomplete=()=>res()})}
function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>resolve(e.target.result);reader.onerror=err=>reject(err);reader.readAsDataURL(file)})}
function formatTime(timestamp){const d=new Date(timestamp);const hh=String(d.getHours()).padStart(2,"0");const mm=String(d.getMinutes()).padStart(2,"0");return `${hh}:${mm}`}
function getDateLabel(ts){const d=new Date(ts);const month=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");return `──── ${month}月${day}日 ────`}
function uuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function toast(msg){const el=document.getElementById("toast");if(!el)return;el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}
async function sendMailNotify(userName,msgContent){
  try{await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{userid:userName,message:msgContent})}catch(err){console.log("邮件发送失败",err)}
}
function broadcastMsg(data){
  try{if(bc)bc.postMessage(data)}catch(e){}
  try{localStorage.setItem("5h_msg_"+Date.now(),JSON.stringify(data));setTimeout(()=>{try{localStorage.removeItem("5h_msg_"+Date.now())}catch(e){}},1000)}catch(e){}
}
window.addEventListener('storage',async function(e){
  if(e.key && e.key.startsWith("5h_msg_") && e.newValue){
    try{
      const data = JSON.parse(e.newValue);
      await handleIncomingMsg(data);
    }catch(err){}
  }
});
async function handleIncomingMsg(data){
  if(data.type === "NEW_MSG"){
    if(document.getElementById("adminPage").style.display === "flex"){
      await renderUserList();
      if(currentSelectUserId === data.payload.userId){
        await loadAdminChat(currentSelectUserId);
      }
    }
    if(document.getElementById("clientChatWrap").style.display =
